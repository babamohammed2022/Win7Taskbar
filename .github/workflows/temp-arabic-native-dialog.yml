name: temp-arabic-native-dialog
on:
  push:
    branches:
      - arena/01a0966f-win7taskbar
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Arabic native dialog strings and validate languages
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          path = Path('native/src/PropertiesDialog.cpp')
          s = path.read_text(encoding='utf-8')

          if 'constexpr Strings kAr = {' not in s:
              marker = '\nconst Strings& StrForLang(int lang) {'
              arabic = r'''

constexpr Strings kAr = {
    L"الخصائص",
    L"شريط المهام", L"حول",
    L"الساعة", L"إظهار الثواني في الساعة",
    L"لوحة:", L"السمة الكلاسيكية (معاد إنشاؤها)", L"Windows 7",
    L"بحث التطبيقات",
    L"تمكين بحث التطبيقات (إعادة تنفيذ اختيارية)",
    L"فتح البحث",
    L"اللغة",
    L"خروج", L"إغلاق Win7Taskbar",
    L"Win7Taskbar مشروع قيد التطوير باستمرار، يعيد إنشاء شريط مهام Windows 7 فوق شريط المهام الحديث. ليست كل الأجزاء مكتملة بعد، ولا نضمن دقة بنسبة 100٪ حالياً. بعض الوظائف معاد بناؤها من الصفر، وبعضها الآخر يعتمد على ربط نوافذ النظام وإعادة تموضعها. إذا وجدت خطأً أو لديك اقتراح، يرجى الإبلاغ عنه للمساعدة في جعل الإصدارات القادمة أكثر دقة واستقراراً. القيود المعروفة: لا يتم دعم تدوير شريط المهام (خيار تجميلي)، ونوافذ النظام (النوافذ المنبثقة وقائمة ابدأ) يتم ربطها وإعادة تموضعها ولا يتم إعادة إنشائها.",
    L"الاعتمادات: 3ds لبعض الموارد الرسومية وللإلهام وراء فكرة XAML.",
    L"موافق", L"إلغاء", L"تطبيق",
    L"نافذة الشبكة المنبثقة", L"نافذة منبثقة:",
    L"Windows 7 (معاد إنشاؤها)", L"Windows 10/11",
    L"النوافذ المنبثقة للنظام",
    L"خلاط الصوت الكلاسيكي (SndVol)",
    L"نافذة البطارية المنبثقة (نمط Windows 7)",
    L"أشرطة الأدوات",
    L"النوافذ المنبثقة",
    L"الساعة:",
    L"الشبكة:",
    L"مستوى الصوت:",
    L"البطارية:",
    L"شريط المهام",
    L"اللغة:",
    L"منطقة الإعلامات",
    L"تخصيص الأيقونات والإعلامات التي تظهر في منطقة الإعلامات.",
    L"تخصيص...",
    L"معاينة سطح المكتب باستخدام Aero Peek",
    L"عرض سطح المكتب مؤقتاً عند تمرير مؤشر الماوس فوق زر إظهار سطح المكتب في نهاية شريط المهام.",
    L"استخدام Aero Peek لمعاينة سطح المكتب",
    L"<a>كيف يمكنني تخصيص شريط المهام؟</a>",
    L"إضافة أشرطة أدوات التعديل إلى شريط المهام. وتتوافر العناصر نفسها في قائمة السياق لشريط المهام.",
    L"شريط أدوات سطح المكتب",
    L"العناوين",
    L"الروابط",
};
'''
              if marker not in s:
                  raise SystemExit('Insertion marker not found')
              s = s.replace(marker, arabic + marker, 1)

          s = s.replace('case 10: return kEn; /* Arabic uses the WPF dictionary for the managed UI. */',
                        'case 10: return kAr;')

          path.write_text(s, encoding='utf-8')

          names = ['kIt','kEn','kEs','kFr','kDe','kPt','kPl','kRu','kJa','kZh','kAr']
          counts = {}
          for name in names:
              m = re.search(r'constexpr Strings ' + name + r' = \{(.*?)\n\};', s, re.S)
              if not m:
                  raise SystemExit(f'missing {name}')
              counts[name] = len(re.findall(r'L"', m.group(1)))
          print('String literal counts:', counts)
          if len(set(counts.values())) != 1:
              raise SystemExit('Language string counts do not match')

          diff = subprocess.run(['git','diff','--check'], capture_output=True, text=True)
          print(diff.stdout)
          if diff.returncode:
              raise SystemExit('git diff --check failed')

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add', str(path)], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
              raise SystemExit('No changes needed')
          subprocess.run(['git','commit','-m','Add Arabic native Properties dialog translation'], check=True)
          subprocess.run(['git','push'], check=True)
