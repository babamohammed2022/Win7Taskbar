name: release

# Builds the self-contained Windows x64 package.
#
#   * on every push to main / manual run -> package uploaded as a workflow
#     artifact (download it from the run page);
#   * on a version tag (v2.58, v3.0...)      -> package attached to a GitHub
#     Release.
#
# "Self-contained" is the point of this workflow: the package must run on a
# Windows 10/11 machine with no .NET installed. The verification step at the
# bottom checks exactly that, and fails the build if the package lost the
# runtime.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release on a tag

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native core (CMake + MSVC)
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release -j 2

      - name: Publish self-contained package
        shell: pwsh
        run: pwsh -File build/publish.ps1 -SkipNative -OutputDir dist-package

      - name: Verify the package is really self-contained
        shell: pwsh
        run: |
          $out = 'dist-package'
          $missing = @()
          foreach ($f in @('Win7Taskbar.exe','Win7TaskbarCore.dll','System.Private.CoreLib.dll',
                           'PresentationFramework.dll','PresentationCore.dll','WindowsBase.dll')) {
            if (-not (Test-Path (Join-Path $out $f))) { $missing += $f }
          }
          foreach ($d in @('Themes','Resources','Languages')) {
            if (-not (Test-Path (Join-Path $out $d))) { $missing += "$d\" }
          }
          if ($missing.Count -gt 0) {
            Write-Error "package is not self-contained, missing: $($missing -join ', ')"
            exit 1
          }
          $cfg = Get-Content (Join-Path $out 'Win7Taskbar.runtimeconfig.json') -Raw | ConvertFrom-Json
          if (-not $cfg.runtimeOptions.includedFrameworks) {
            Write-Error 'runtimeconfig.json has no includedFrameworks: the app would need .NET installed'
            exit 1
          }
          $cfg.runtimeOptions.includedFrameworks | ForEach-Object { Write-Host "included: $($_.name) $($_.version)" }
          $size = [math]::Round((Get-ChildItem $out -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "package size: $size MB"

      - name: Zip the package
        shell: pwsh
        run: |
          $version = (Select-String -Path src/Win7Taskbar/Win7Taskbar.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $zip = "Win7Taskbar-$version-win-x64.zip"
          Compress-Archive -Path dist-package/* -DestinationPath $zip
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SIZE=" + [math]::Round((Get-Item $zip).Length / 1MB, 1) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Win7Taskbar-win-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
        # Lo storage artefatti puo' esaurirsi (quota GitHub): il pacchetto
        # deve finire nella release anche senza l'artefatto di comodo, quindi
        # un upload fallito non deve fermare il passo di attach sotto.
        continue-on-error: true

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          name: Win7Taskbar ${{ github.ref_name }}
          draft: false
          # 1.0.0-alpha: pre-release finche' la numerazione resta "alpha".
          prerelease: contains(github.ref_name, 'alpha')
          body: |
            Pacchetto **self-contained** per Windows 10/11 **x64**: scarica,
            scompatta e avvia `Win7Taskbar.exe`. Non serve installare .NET.

            * The package is self-contained: no .NET installation required.
            * Extract the whole folder (keep `Themes\`, `Resources\` and
              `Languages\` next to the executable) and run `Win7Taskbar.exe`.
            * To close it: right-click the clock -> Properties -> "Close Win7Taskbar".

            **Window thumbnails:** temporarily disabled. **Tooltips:** supported.
